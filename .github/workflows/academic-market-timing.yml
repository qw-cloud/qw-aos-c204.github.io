name: Update Academic Market Timing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/academic-market-timing.yml"
      - "projects/academic-market-timing/scripts/update_market.py"
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect market signals
        run: python projects/academic-market-timing/scripts/update_market.py
      - name: Commit refreshed data
        run: |
          git config user.name "academic-market-bot"
          git config user.email "academic-market-bot@users.noreply.github.com"
          git add projects/academic-market-timing/data/latest.json projects/academic-market-timing/data/history.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: daily academic job market snapshot"
            git push
          fi
